apiVersion: apps/v1
kind: Deployment
metadata:
  name: server

  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: true

spec:
  replicas: 1
  selector:
    matchLabels:
      resultes.net/component: server
  template:
    metadata:
      labels:
        resultes.net/component: server
    spec:
      containers:
        - image: ghcr.io/resultes-net/server:latest
          name: server
          env:
            - name: POSTGRES_PASSWORD
              value: example

          ports:
            - containerPort: 80
              protocol: TCP
          imagePullSecrets:
            - name: ghcr-io-auth-secret
              namespace: resultes
      restartPolicy: Always
