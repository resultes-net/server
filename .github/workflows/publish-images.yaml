name: Create and publish Docker images

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        image:
          - folder: server
            name: server
          - folder: migrate
            name: server-migrate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: 'true'
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f docker/${{ matrix.image.folder }}/Dockerfile -t ghcr.io/resultes-net/${{ matrix.image.name }}:latest .

      - name: Push Docker image
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/resultes-net/${{ matrix.image.name }}:latest
