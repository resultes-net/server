name: Create and publish Docker images

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        image:
          - folder: server
            name: server
          - folder: migrate
            name: server-migrate
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.READ_RESULTES_REPOS_APP_ID }}
          private-key: ${{ secrets.READ_RESULTES_REPOS_APP_KEY }}
          repositories: |
            server
            dev-utils
            database-utils
            docker-utils
            openapi-schema
            pydantic-models
            openstack-utils
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          submodules: 'true'
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -f docker/${{ matrix.image.folder }}/Dockerfile -t ghcr.io/resultes-net/${{ matrix.image.name }}:latest .

      - name: Push Docker image
        id: push
        run: |
          docker push ghcr.io/resultes-net/${{ matrix.image.name }}:latest
